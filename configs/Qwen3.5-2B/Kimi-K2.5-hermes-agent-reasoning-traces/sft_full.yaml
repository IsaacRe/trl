# Full fine-tuning: Qwen3.5-2B on lambda/hermes-agent-reasoning-traces (kimi split)
#
# Run with:
#   CUDA_VISIBLE_DEVICES=0 .venv/bin/python scripts/train_sft.py \
#     --config configs/Qwen3.5-2B/hermes-agent-reasoning-traces/sft_full.yaml

# Dataset
dataset_name: lambda/hermes-agent-reasoning-traces
dataset_config: kimi
dataset_train_split: train
dataset_streaming: true

# Model
model_name_or_path: Qwen/Qwen3.5-2B
dtype: bfloat16
attn_implementation: sdpa

# Output
output_dir: ""
run_name: kimi_agent_sft
report_to: none

# Training hyperparameters
max_steps: 1000
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

# Sequence length
max_length: 4096
packing: false

# Precision & memory
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# Logging & evaluation
logging_steps: 1
eval_strategy: "no"
save_strategy: steps
save_steps: 200
# save_total_limit: 3

# Misc
dataloader_num_workers: 1

# Full forward-pass eval (loss, token accuracy, entropy)
full_eval:
  eval_steps: 50
  datasets:
    - dataset: data/kimi-k2.6-claude-code-traces.parquet
      name: kimi-cc
      max_turns: 4
      n_samples: 1
      max_length:
    - dataset: lambda/hermes-agent-reasoning-traces
      name: train
      n_samples: 5
      max_length:
