# Full fine-tuning: Qwen3-1.7B on lambda/hermes-agent-reasoning-traces (kimi split)
#
# Run with:
#   CUDA_VISIBLE_DEVICES=0 .venv/bin/python scripts/train_sft.py \
#     --config configs/Qwen3-1.7B/hermes-agent-reasoning-traces/sft_full.yaml

# Dataset
dataset_name: lambda/hermes-agent-reasoning-traces
dataset_config: kimi
dataset_train_split: train
dataset_streaming: true

# Model
model_name_or_path: Qwen/Qwen3-1.7B
dtype: bfloat16
attn_implementation: sdpa

# Output
output_dir: ""
run_name: kimi_agent_sft
report_to: none

# Training hyperparameters
max_steps: 1000
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

# Sequence length
max_length: 4096
packing: false

# Precision & memory
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# Loss — train on assistant tokens only
# assistant_only_loss: true

# Logging & evaluation
logging_steps: 1
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 200
# save_total_limit: 3

# Misc
dataloader_num_workers: 1

# Speculative decoding acceptance eval
spec_dec_eval:
  - dataset: data/kimi-k2.6-claude-code-traces.parquet
    name: kimi-cc
    n_drafts: 4
    d_tokens: 8
    n_samples: 1
    temperature: 0.8
  - dataset: lambda/hermes-agent-reasoning-traces
    name: train
    n_drafts: 4
    d_tokens: 8
    n_samples: 1
    temperature: 0.8
