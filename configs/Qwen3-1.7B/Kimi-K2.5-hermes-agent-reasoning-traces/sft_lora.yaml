# LoRA fine-tuning: Qwen3-1.7B on lambda/hermes-agent-reasoning-traces (kimi split)
# Rank-256 LoRA on q_proj, k_proj, v_proj, o_proj only.
#
# Run with:
#   CUDA_VISIBLE_DEVICES=0 .venv/bin/python scripts/train_sft.py \
#     --config configs/Qwen3-1.7B/hermes-agent-reasoning-traces/sft_lora.yaml

# Dataset
dataset_name: lambda/hermes-agent-reasoning-traces
dataset_config: kimi
dataset_train_split: train
dataset_streaming: true

# Model
model_name_or_path: Qwen/Qwen3-1.7B
dtype: bfloat16
attn_implementation: sdpa

# PEFT / LoRA
use_peft: true
lora_r: 256
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Output
output_dir: ""
run_name: kimi_agent_sft
report_to: none

# Training hyperparameters
max_steps: 1000
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01

# Sequence length
max_length: 32_000
packing: false

# Precision & memory
bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# Loss mode — pick ONE:
#   assistant_only_loss: true   trains on ALL assistant turns (intermediate turns
#                               have reasoning stripped by the Qwen3 template;
#                               final turn retains its <think> block)
#   completion_only_loss: true   trains ONLY on the sampled final assistant turn
#                               (with reasoning); uses prompt-completion format
assistant_only_loss: true
# completion_only_loss: true

# Logging & evaluation
logging_steps: 1
eval_strategy: "no"
save_strategy: steps
save_steps: 200
# save_total_limit: 3

# Misc
dataloader_num_workers: 1

# Full forward-pass eval (loss, token accuracy, entropy)
full_eval:
  eval_steps: 10
  datasets:
    - dataset: data/kimi-k2.6-claude-code-traces.parquet
      name: claude-code
      n_samples: 3
      max_turns: 10
      max_length:
    - dataset: data/kimi-k2.6-agent.parquet
      name: codex
      n_samples: 3
      max_turns: 10
      max_length:

spec_dec_eval:
  eval_steps: 200
  datasets:
    - dataset: data/kimi-k2.6-claude-code-traces.parquet
      name: claude-code
      n_drafts: 4
      n_samples: 1
      d_tokens: 16
      max_characters: 8000
      temperature: 0.6
    - dataset: data/kimi-k2.6-agent.parquet
      name: codex
      n_drafts: 4
      n_samples: 1
      d_tokens: 16
      max_characters: 8000
      temperature: 0.6